<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dispatch app icon: the Aurora logo (spec decision 31). Must match AuroraIcon in src/components/brand.tsx. -->
  <defs>
    <radialGradient id="bg" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#2A1F5C"/>
      <stop offset="1" stop-color="#0E0B1F"/>
    </radialGradient>
    <linearGradient id="bubble" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#FF5CA8"/>
      <stop offset="1" stop-color="#FFB35C"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: iOS and Android round the corners themselves. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- The logo at 64% of the icon, centred, so it stays inside the area Android keeps when it trims icons. -->
  <g transform="translate(92 92) scale(6.8333)">
    <path d="M24 4a20 20 0 1 1-10.4 37.1L5 44l2.9-8.6A20 20 0 0 1 24 4z" fill="url(#bubble)"/>
    <path d="M13 24c2.5-6 5-6 7.5 0s5 6 7.5 0 5-6 7.5 0" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
