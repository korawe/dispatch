<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dispatch app icon (spec decision 31): the Aurora speech bubble and sound wave in Pulse colours.
       Must match AppIcon in src/components/brand.tsx. -->
  <!-- Full-bleed square: iOS and Android round the corners themselves. -->
  <rect width="512" height="512" fill="#2B59FF"/>
  <!-- The logo at 64% of the icon, centred, so it stays inside the area Android keeps when it trims icons. -->
  <g transform="translate(92 92) scale(6.8333)">
    <path d="M24 4a20 20 0 1 1-10.4 37.1L5 44l2.9-8.6A20 20 0 0 1 24 4z" fill="#FFD23F"/>
    <path d="M13 24c2.5-6 5-6 7.5 0s5 6 7.5 0 5-6 7.5 0" fill="none" stroke="#2B59FF" stroke-width="3.2" stroke-linecap="round"/>
  </g>
</svg>
